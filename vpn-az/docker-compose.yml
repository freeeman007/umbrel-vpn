services:
  app_proxy:
    environment:
      APP_HOST: host.docker.internal
      APP_PORT: 8666
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  server:
    image: alpine:3.20
    user: "0:0"
    restart: unless-stopped
    network_mode: host
    # privileged нужен ради /dev/net/tun, iptables и маршрутов хоста
    privileged: true
    environment:
      DATA: /data
      APP_PASSWORD: ${APP_PASSWORD}
      AZ_DNS_UPSTREAM: 1.1.1.1
      AZ_VPN_SUBNET: 10.28.0.0/22
      TZ: Europe/Moscow
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - /home/umbrel/vpn-code:/code:ro
      # манифесты приложений: из них берутся имена и порты для ссылок в уведомлении
      - /home/umbrel/umbrel/app-data:/apps:ro
    # код доставляется каталогом /code (монтируется с хоста, путь выше) — работает без
    # интернета; если каталог пуст, запасной путь: два CDN по очереди, в /data всегда
    # остаётся последняя рабочая копия
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache ca-certificates curl >/dev/null 2>&1
        update-ca-certificates >/dev/null 2>&1 || true
        mkdir -p /data
        # основной путь доставки: каталог /code, смонтированный с хоста
        if [ -s /code/boot.sh ]; then
          cp /code/boot.sh /data/boot.sh && exec /bin/sh /data/boot.sh
        fi
        # запасной путь: зеркала. ВНИМАНИЕ: docker compose подставляет $VAR в этой
        # строке, поэтому переменных оболочки здесь быть не должно.
        for attempt in 1 2 3 4 5 6; do
          curl -fsS --max-time 25 "https://cdn.jsdelivr.net/gh/freeeman007/umbrel-vpn@v3.7.2/vpn-az/scripts/boot.sh" -o /data/boot.sh.new || \
          curl -fsS --max-time 25 "https://raw.githubusercontent.com/freeeman007/umbrel-vpn/main/vpn-az/scripts/boot.sh" -o /data/boot.sh.new || true
          if [ -s /data/boot.sh.new ]; then
            mv /data/boot.sh.new /data/boot.sh
            exec /bin/sh /data/boot.sh
          fi
          echo "boot.sh не скачался (попытка), повтор через 15 с"
          sleep 15
        done
        echo "нет сети для доставки кода — стартую последнюю сохранённую копию"
        exec /bin/sh /data/boot.sh
