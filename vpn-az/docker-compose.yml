services:
  app_proxy:
    environment:
      APP_HOST: host.docker.internal
      APP_PORT: 8666
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  server:
    image: alpine:3.20
    user: "0:0"
    restart: unless-stopped
    network_mode: host
    # privileged нужен ради /dev/net/tun, iptables и маршрутов хоста
    privileged: true
    environment:
      DATA: /data
      APP_PASSWORD: ${APP_PASSWORD}
      AZ_DNS_UPSTREAM: 1.1.1.1
      AZ_VPN_SUBNET: 10.28.0.0/22
      TZ: Europe/Moscow
    volumes:
      - ${APP_DATA_DIR}/data:/data
      # код приложения едет вместе с приложением, без скачивания с GitHub
      - ./scripts:/scripts:ro
    command: ["/bin/sh", "/scripts/boot.sh"]
