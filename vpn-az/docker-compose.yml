services:
  app_proxy:
    environment:
      APP_HOST: host.docker.internal
      APP_PORT: 8666
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  server:
    image: alpine:3.20
    user: "0:0"
    restart: unless-stopped
    network_mode: host
    # privileged нужен ради /dev/net/tun, iptables и маршрутов хоста
    privileged: true
    environment:
      DATA: /data
      APP_PASSWORD: ${APP_PASSWORD}
      AZ_DNS_UPSTREAM: 1.1.1.1
      AZ_VPN_SUBNET: 10.28.0.0/22
      TZ: Europe/Moscow
    volumes:
      - ${APP_DATA_DIR}/data:/data
    # код тянется из двух CDN по очереди (jsDelivr, затем raw.githubusercontent),
    # в /data всегда остаётся последняя рабочая копия — при недоступности сети приложение стартует с неё
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache ca-certificates curl >/dev/null 2>&1
        mkdir -p /data
        i=0
        while [ $i -lt 30 ]; do
          i=$((i+1))
          for base in \
            "https://cdn.jsdelivr.net/gh/freeeman007/umbrel-vpn@v3.0.7/vpn-az/scripts" \
            "https://raw.githubusercontent.com/freeeman007/umbrel-vpn/main/vpn-az/scripts"
          do
            if curl -fsS --max-time 25 "$base/boot.sh?t=$(date +%s)" -o /data/boot.sh.new 2>/dev/null; then
              mv /data/boot.sh.new /data/boot.sh
              exec /bin/sh /data/boot.sh
            fi
          done
          echo "boot.sh недоступен, попытка $i, повтор через 20 с"
          sleep 20
        done
        echo "нет сети для доставки кода — стартую последнюю сохранённую копию"
        [ -f /data/boot.sh ] && exec /bin/sh /data/boot.sh
        sleep 3600
