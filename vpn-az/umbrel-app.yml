manifestVersion: 1
id: vpn-az
icon: https://raw.githubusercontent.com/freeeman007/umbrel-vpn/main/vpn-az/icon.png
category: networking
name: VPN
version: "3.7.2"
tagline: VPN-клиент с библиотекой профилей и включением в один тап
description: >-
  Клиент к своему VPN-серверу прямо на Umbrel: библиотека профилей
  OpenVPN (.ovpn) и WireGuard (.conf), включение и выключение одной кнопкой,
  переключение между серверами, статус туннеля и защита от потери связи.


  Туннель работает на уровне сервера: весь трафик Umbrel и его приложений
  идёт через выбранный узел. Профиль загружается файлом (в том числе пакетом:
  .ovpn + ca.crt + ключи) или вставкой текста, при необходимости — с логином
  и паролем. Поддерживаются сторонние провайдеры.


  Включён автооткат: если после подключения через туннель нет связи дольше
  90 секунд, туннель выключается сам, а в панели появляется причина. Локальная
  подсеть остаётся доступной напрямую, поэтому Umbrel не теряется.


  Панель открывается с телефона и компьютера, добавляется на домашний экран
  как приложение. Там же: перехват DNS всех приложений Umbrel через узел,
  NAT в домашнюю сеть и журнал диагностики.
developer: lii-it
website: https://lii-it.ru
dependencies: []
repo: https://github.com/freeeman007/umbrel-vpn
support: https://github.com/freeeman007/umbrel-vpn/issues
gallery: []
path: ""
defaultUsername: umbrel
deterministicPassword: true
port: 8666
submitter: freeeman007
submission: https://github.com/freeeman007/umbrel-vpn
releaseNotes: >-
  3.7.0 — иконки в уведомлениях Telegram; нажатие на профиль открывает карточку с просмотром и
  правкой (название, конфиг, логин/пароль, пароль ключа); диалог добавления WireGuard показывает
  только поля протокола; автоподключение выбирается по профилям (основной + доп. туннели);
  отдельный статус дополнительных туннелей.
  3.6.2 — успешный подъём доп. туннеля снимает прошлое предупреждение о нём из статуса.
  3.6.1 — поддержка ключей OpenVPN под паролем: на карточке профиля кнопка с ключом,
  пароль хранится в данных профиля (0600) и подставляется в openvpn как --askpass.
  Если ключ зашифрован, а пароль не задан, в панели будет понятная подсказка вместо
  «не получил адрес».
  3.6.0 — дополнительные туннели: кнопка «+» на карточке профиля поднимает второй,
  третий и т.д. туннель только ради маршрутов к его сетям (корпоративная и подобные).
  Интернет всегда идёт через основной профиль, default и DNS доп. туннели не трогают;
  профиль «весь трафик» дополнительным подключить нельзя. В Telegram — строка с адресами
  доп. туннелей.
  3.5.0 — приложение называется VPN; профили разделены по протоколам — OpenVPN и
  WireGuard, у каждого своя кнопка «Добавить», конфиг не того типа отклоняется с
  подсказкой. У профилей WireGuard убрана строка про AmneziaWG.
  3.4.6 — удачная отправка (в том числе кнопкой «Проверить уведомление») снимает
  из статуса прошлую ошибку отправки.
  3.4.5 — пояснение у строки «Уведомления в Telegram» дополнено: в сообщении теперь
  есть ссылки на приложения.
  3.4.4 — в уведомление Telegram добавлены ссылки на всё, что запущено на Umbrel:
  имя и порт берутся из манифестов приложений (каталог app-data монтируется в /apps),
  поэтому список сам обновляется при установке и удалении приложений. Отправка
  повторяется, если сразу после подъёма туннеля сеть ещё недоступна. Пояснение
  к «NAT в домашнюю сеть» больше не упоминает конкретную подсеть.
  3.4.3 — адреса сервера приходят в Telegram: после подключения и после запуска
  Umbrel приходит сообщение с адресом в туннеле, LAN-адресом и внешним IP — по ним
  видно, куда заходить с телефона, даже если сервер увезли в другое место. Одинаковые
  адреса повторно не отправляются; если туннель не поднялся, приходит причина.
  Токен и chat_id хранятся в /data (в репозиторий не попадают), настраиваются в панели.
  3.4.2 — у приложения появилась иконка: тёмный квадрат, зелёное кольцо, белый щит
  с замком в цветах панели (лежит в репозитории, vpn-az/icon.png и icon.svg).
  3.4.1 — пояснения к функциям сервера больше не занимают место в карточке: текст спрятан под
  знаком «?» рядом с названием и всплывает при наведении курсора; на телефоне — по тапу, панелью
  снизу экрана. Тексты пояснений уточнены.
  3.4.0 — «NAT в домашнюю сеть» теперь работает с любым сервером: маскарад ставится
  на реальные подсети туннеля, а не на угаданную 10.28.0.0/22 (KZ выдаёт 10.29.0.0/22,
  AZ — 10.29.8.0/24). Из VPN-клиента снова открываются Umbrel (10.29.0.2) и домашние
  адреса 192.168.11.x: раньше ответы из дома уходили в никуда. Список подсетей
  запоминается при включении, чтобы правила снимались и после отключения туннеля.
  3.3.0 — внешний IP снова показывается: проверка идёт по нескольким сервисам, только по IPv4
  и сразу после подключения, а рядом с IP появилась кнопка «проверить сейчас»; если сервис не
  ответил, в панели видна причина. Переключатель «Автоподключение при старте» больше не сбивается
  при ручном выключении туннеля и не включается сам. Конфиг WireGuard из AmneziaWG (строки
  Jc/S1/H1…) больше не падает с «wg setconf: ошибка в конфиге»: лишние параметры отбрасываются
  с предупреждением, а после подъёма проверяется рукопожатие — «подключено» без связи не бывает.
  3.2.3 — туннель поднимается сам после включения и перезагрузки сервера (если его не выключали
  руками), резолверы хоста выведены мимо туннеля отдельными маршрутами — имена не пропадают
  даже когда сервер AZ уводит клиентский DNS в свой резолвер; мёртвая первая сессия отваливается
  за ~12 с вместо 30.
  3.2.2 — полный туннель больше не оставляет сервер без DNS: запросы хоста уводятся в резолвер
  туннеля, контейнеры — через перехват, а если через туннель не резолвятся имена, туннель
  откатывается автоматически с понятной причиной.
  3.2.1 — доставка кода больше не зависит от интернета: скрипты берутся из каталога /code
  (монтируется с хоста), запасной путь — CDN. Если скрипты в /code обновились, приложение
  подхватывает их в течение минуты само, без перезапуска контейнера и без обновления из стора.
  3.2.0 — исправлена доставка кода: docker compose подставлял `$i` в стартовую команду, из-за чего
  цикл скачивания падал на первом же шаге и приложение оставалось на старых скриптах.
  Теперь загрузка с повторами и подробным логом причин отказа.
  3.1.0 — автоподъём туннеля при запуске приложения: переключатель «Включать туннель при запуске»
  поднимает последний активный профиль после перезапуска контейнера или сервера
  (в том числе после штатной остановки, которая снимает туннель). Перехват DNS при автоподъёме
  восстанавливается автоматически, если был включён.
  3.0.7 — проверка сайта (/api/check) идёт по IPv4: туннель IPv4-only, из-за AAAA-попытки проверки падали мгновенно.
  3.0.6 — проба туннеля пингует шлюз туннеля, поэтому сплит-режим больше не показывается как «связи нет»;
  новый /api/check проверяет любой сайт с сервера напрямую и через туннель (код, время, IP).
  3.0.5 — статус показывает, слушает ли локальный DNS-резолвер (проверка по коду возврата, а не по пустому выводу grep).
  3.0.4 — доставка скриптов с двух зеркал (raw.githubusercontent, jsDelivr) с проверкой размера;
  запуск приложения больше не зависит от одного CDN.
  3.0.3 — код приложения едет внутри приложения (том /scripts), без скачивания с GitHub:
  раньше при обновлении подхватывалась устаревшая копия из CDN.
  3.0.2 — полный туннель определяется по факту (default-маршрут ушёл в tun), а не по тексту конфига:
  сервер AZ пушит redirect-gateway, которого в .ovpn нет, из-за чего автооткат не включался.
  3.0.1 — проба выхода в интернет по IP через http и https (без DNS), чтобы автооткат не срабатывал на рабочем туннеле из-за закрытого порта 80.
  3.0.0 — библиотека профилей: несколько .ovpn/.conf одновременно, переключение между ними,
  загрузка файлами (включая пакет .ovpn + ca.crt + ключи) и zip, логин/пароль для провайдеров.
  Кнопка включения и выключения, состояния «подключаюсь / подключено / ошибка» с таймером.
  Автооткат: если через туннель нет связи 90 секунд, туннель выключается автоматически.
  Локальная подсеть всегда остаётся напрямую — Umbrel не теряется при полном туннеле.
  Вход в панель по паролю приложения, установка на домашний экран (PWA), журнал диагностики.
  2.1.4 — `up` больше не перезапускает живой туннель (перезапуск каждые 45 с и был причиной «сеть падает»).
