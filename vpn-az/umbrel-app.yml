manifestVersion: 1
id: vpn-az
category: networking
name: VPN AZ
version: "3.0.4"
tagline: VPN-клиент с библиотекой профилей и включением в один тап
description: >-
  Клиент к своему VPN-серверу прямо на Umbrel: библиотека профилей
  OpenVPN (.ovpn) и WireGuard (.conf), включение и выключение одной кнопкой,
  переключение между серверами, статус туннеля и защита от потери связи.


  Туннель работает на уровне сервера: весь трафик Umbrel и его приложений
  идёт через выбранный узел. Профиль загружается файлом (в том числе пакетом:
  .ovpn + ca.crt + ключи) или вставкой текста, при необходимости — с логином
  и паролем. Поддерживаются сторонние провайдеры.


  Включён автооткат: если после подключения через туннель нет связи дольше
  90 секунд, туннель выключается сам, а в панели появляется причина. Локальная
  подсеть остаётся доступной напрямую, поэтому Umbrel не теряется.


  Панель открывается с телефона и компьютера, добавляется на домашний экран
  как приложение. Там же: перехват DNS всех приложений Umbrel через узел,
  NAT в домашнюю сеть и журнал диагностики.
developer: lii-it
website: https://lii-it.ru
dependencies: []
repo: https://github.com/freeeman007/umbrel-vpn
support: https://github.com/freeeman007/umbrel-vpn/issues
gallery: []
path: ""
defaultUsername: umbrel
deterministicPassword: true
port: 8666
submitter: freeeman007
submission: https://github.com/freeeman007/umbrel-vpn
releaseNotes: >-
  3.0.4 — доставка скриптов с двух зеркал (raw.githubusercontent, jsDelivr) с проверкой размера;
  запуск приложения больше не зависит от одного CDN.
  3.0.3 — код приложения едет внутри приложения (том /scripts), без скачивания с GitHub:
  раньше при обновлении подхватывалась устаревшая копия из CDN.
  3.0.2 — полный туннель определяется по факту (default-маршрут ушёл в tun), а не по тексту конфига:
  сервер AZ пушит redirect-gateway, которого в .ovpn нет, из-за чего автооткат не включался.
  3.0.1 — проба выхода в интернет по IP через http и https (без DNS), чтобы автооткат не срабатывал на рабочем туннеле из-за закрытого порта 80.
  3.0.0 — библиотека профилей: несколько .ovpn/.conf одновременно, переключение между ними,
  загрузка файлами (включая пакет .ovpn + ca.crt + ключи) и zip, логин/пароль для провайдеров.
  Кнопка включения и выключения, состояния «подключаюсь / подключено / ошибка» с таймером.
  Автооткат: если через туннель нет связи 90 секунд, туннель выключается автоматически.
  Локальная подсеть всегда остаётся напрямую — Umbrel не теряется при полном туннеле.
  Вход в панель по паролю приложения, установка на домашний экран (PWA), журнал диагностики.
  2.1.4 — `up` больше не перезапускает живой туннель (перезапуск каждые 45 с и был причиной «сеть падает»).
