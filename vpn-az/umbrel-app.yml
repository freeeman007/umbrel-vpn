manifestVersion: 1
id: vpn-az
category: networking
name: AntiZapret Client
version: "2.1.3"
tagline: VPN-клиент к своему AZ-узлу, без зависимости от роутера
description: >-
  Постоянный туннель с Umbrel к своему узлу AntiZapret (OpenVPN или WireGuard).
  В панели приложения загружается профиль .ovpn из панели AZ: полный туннель
  (весь трафик, включая DNS, уходит через узел) или сплит (в туннель идут
  только заблокированные адреса). Роутер не участвует, проброс портов не нужен.


  Приложение поднимает локальный DNS-резолвер и по желанию перехватывает
  DNS-запросы всех контейнеров Umbrel, чтобы домены резолвились через узел.


  Для входа на Umbrel снаружи: если на узле AZ включена видимость клиентов,
  Umbrel доступен по своему туннельному адресу с любого клиента узла. Включив
  NAT в домашнюю сеть, можно открывать и адреса вида 192.168.11.x.


  Управление: карточка приложения (порт 8666) — статус туннеля и адресов,
  загрузка профиля, переключатели DNS-перехвата и NAT в LAN.
developer: lii-it
website: https://lii-it.ru
dependencies: []
repo: https://github.com/freeeman007/umbrel-vpn
support: https://github.com/freeeman007/umbrel-vpn/issues
gallery: []
path: ""
defaultUsername: umbrel
deterministicPassword: true
port: 8666
submitter: freeeman007
submission: https://github.com/freeeman007/umbrel-vpn
releaseNotes: >-
  2.1.3 — перехват DNS через две цепочки (owner-match только в OUTPUT, иначе nft
  отклоняет правило в PREROUTING), проба живости туннеля по IP без DNS
  (раньше ложные падения перезапускали openvpn каждые две минуты).
  2.1.2 — остановка openvpn убивает все свои процессы (при duplicate-cn оставалась
  вторая сессия с тем же адресом в туннеле).
  2.1.1 — домашний интерфейс определяется по адресу, а не по default-маршруту
  (при полном туннеле NAT в LAN уходил в туннель).
  2.1.0 — исправлен перехват DNS: резолвер работает под отдельным uid и его запросы
  не заворачиваются в DNAT (была петля и полный отказ DNS), полный туннель
  определяется корректно (0.0.0.0/1 + 128.0.0.0/1).
  2.0.0 — OpenVPN-клиент (профили .ovpn: полный туннель и сплит) с автоопределением
  режима, локальный DNS-резолвер с переключаемым перехватом, NAT в домашнюю сеть
  для доступа по локальным адресам, перезапуск туннеля по пробе.
  1.0.1 — WG-вариант: порт сервера 51920, переключаемый DNS-перехват.
  1.0.0 — первый выпуск.
