manifestVersion: 1
id: vpn-az
category: networking
name: VPN AZ
version: "3.4.1"
tagline: VPN-клиент с библиотекой профилей и включением в один тап
description: >-
  Клиент к своему VPN-серверу прямо на Umbrel: библиотека профилей
  OpenVPN (.ovpn) и WireGuard (.conf), включение и выключение одной кнопкой,
  переключение между серверами, статус туннеля и защита от потери связи.


  Туннель работает на уровне сервера: весь трафик Umbrel и его приложений
  идёт через выбранный узел. Профиль загружается файлом (в том числе пакетом:
  .ovpn + ca.crt + ключи) или вставкой текста, при необходимости — с логином
  и паролем. Поддерживаются сторонние провайдеры.


  Включён автооткат: если после подключения через туннель нет связи дольше
  90 секунд, туннель выключается сам, а в панели появляется причина. Локальная
  подсеть остаётся доступной напрямую, поэтому Umbrel не теряется.


  Панель открывается с телефона и компьютера, добавляется на домашний экран
  как приложение. Там же: перехват DNS всех приложений Umbrel через узел,
  NAT в домашнюю сеть и журнал диагностики.
developer: lii-it
website: https://lii-it.ru
dependencies: []
